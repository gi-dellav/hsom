name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONPATH: src:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Test
        run: pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Typecheck
        run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build pip-audit
          python -m build
      - name: Clean-install smoke test
        run: |
          python -m venv /tmp/hsom-venv
          /tmp/hsom-venv/bin/python -m pip install --upgrade pip
          /tmp/hsom-venv/bin/pip install dist/*.whl
          /tmp/hsom-venv/bin/python -c "import hsom; print(hsom.__version__)"
          /tmp/hsom-venv/bin/hsom --help
          /tmp/hsom-venv/bin/pip check
      - name: Dependency audit
        run: |
          python -m pip install --target /tmp/hsom-site dist/*.whl
          python -m pip_audit --path /tmp/hsom-site
