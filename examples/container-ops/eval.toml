input = "run the make test target"
expected = "make test"

[[test]]
name = "make build"
input = "run make build"
expected = "make build"

[[test]]
name = "make default"
input = "run the default make target"
expected = "make"

[[test]]
name = "make clean"
input = "clean the build artifacts with make"
expected = "make clean"

[[test]]
name = "make deploy"
input = "deploy the project with make"
expected = "make deploy"

[[test]]
name = "make build verbose degrade"
input = "run the make build target with verbose output"
expected = "make build"

[[test]]
name = "make test stop degrade"
input = "run the make test target and stop on failure"
