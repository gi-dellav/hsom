# Held-out benchmark suite. The freeze manifest records this file's hash.
# Cases are single-shot: the loop/chaining evaluation is out of scope.

# ---------------------------------------------------------------- docker
[[test]]
name = "build image"
input = "build the docker image"
expected = "docker build ."

[[test]]
name = "build without cache"
input = "rebuild the image without using the build cache"
expected = "docker build . --no-cache"

[[test]]
name = "running containers"
input = "list the running containers"
expected = "docker ps"

[[test]]
name = "all containers"
input = "show all containers including stopped ones"
expected = "docker ps -a"

[[test]]
name = "stopped containers"
input = "show stopped containers"
expected = "docker ps -a"

[[test]]
name = "local images"
input = "show the local docker images"
expected = "docker images"

[[test]]
name = "compose up background"
input = "start the compose services in the background"
expected = "docker compose up -d"

[[test]]
name = "compose up foreground"
input = "start the compose services"
expected = "docker compose up"

[[test]]
name = "compose down"
input = "stop the compose stack"
expected = "docker compose down"

[[test]]
name = "logs tail 50"
input = "show the last 50 lines of the compose logs"
expected = "docker compose logs --tail=50"

[[test]]
name = "logs tail 20"
input = "show the last twenty lines of compose output"
expected = "docker compose logs --tail=20"

[[test]]
name = "logs tail 100"
input = "show the last 100 lines of the compose logs"
expected = "docker compose logs --tail=100"

[[test]]
name = "logs no tail"
input = "show the compose logs"
expected = "docker compose logs"

[[test]]
name = "logs unsupported tail"
input = "show the last 500 lines of compose output"
expected = "docker compose logs"

