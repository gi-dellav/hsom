# ---------------------------------------------------------------- grep
[[test]]
name = "grep TODO src"
input = "search the src directory for TODO"
expected = "grep -R src -e TODO"

[[test]]
name = "grep FIXME tests"
input = "search the tests directory for FIXME"
expected = "grep -R tests -e FIXME"

[[test]]
name = "grep import line numbers"
input = "recursively search src for import with line numbers"
expected = "grep -R src -e import -n"

[[test]]
name = "grep def docs"
input = "search docs for def"
expected = "grep -R docs -e def"

# ---------------------------------------------------------------- find
[[test]]
