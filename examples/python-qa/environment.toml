[meta]
# Pinned; OpenRouter resolves this to typesafe/jev-1.13-20260917.
model = "jev-1.13"
min_confidence = 0.5
timeout = 60
# Default provider for this example: OpenRouter System One API.
# Billed to your OpenRouter account. Requires OPENROUTER_API_KEY.
provider = "openrouter"
default_risk = "read"
max_steps = 1
max_history = 5
temperature = 0.0
command_question = "What Python QA task is the user asking for: testing, linting, format checking, running a script, or listing files?"
  [meta.risk_thresholds]
  read = 0.5
  write = 0.7
  destructive = 0.9

# ---------------------------------------------------------------- pytest
[[command]]
name = "pytest"
description = "run the project's Python test suite"
argv = ["pytest", "-q"]
# Tests import and execute user-controlled code, so this is not read-only.
risk = "write"

  [[command.flag]]
  name = "-x"
  description = "stop after the first failure"
  argv_fragment = ["-x"]
  question = "Does the user want to stop after the first failure?"

  [[command.flag]]
  name = "--tb"
  description = "traceback verbosity for test failures"
  argv_fragment = ["--tb={value}"]
  values = ["short", "long", "no"]
  question = "Does the request ask for a specific traceback verbosity?"
  [command.flag.value_descriptions]
  short = "short traceback summary"
  long = "full long traceback"
  no = "no traceback output"

# ---------------------------------------------------------------- ruff
[[command]]
name = "ruff"
description = "lint or format-check Python code"
risk = "read"
instructions_subcommand = "Does the request need a lint check or a format check?"

  [[command.subcommand]]
  name = "check"
  description = "lint Python code"
  argv = ["ruff", "check", "{path:target}"]
  risk = "read"

    [[command.subcommand.path]]
    name = "target"
    kind = "both"
    optional = true
    description = "file or directory to lint (omit to lint the whole project)"
    base = "."
    depth = 2
    glob = "*.py"
    question = "Which file or directory should be linted?"
    stated_question = "Does the request name a specific file or directory to lint?"

  [[command.subcommand]]
  name = "format"
  description = "format-check Python code without writing"
  argv = ["ruff", "format", "--check", "{path:target}"]
  risk = "read"

    [[command.subcommand.path]]
    name = "target"
    kind = "both"
    optional = true
    description = "file or directory to format-check (omit for the whole project)"
    base = "."
    depth = 2
    glob = "*.py"
    question = "Which file or directory should be format-checked?"
    stated_question = "Does the request name a specific file or directory to format-check?"

# ---------------------------------------------------------------- python
[[command]]
name = "python"
description = "run a Python script"
argv = ["python", "{path:script}"]
# Runs arbitrary user code, so this is not read-only.
risk = "write"

  [[command.path]]
  name = "script"
  kind = "files"
  optional = false
  description = "Python script to run"
  base = "."
  depth = 2
  glob = "*.py"
  question = "Which Python script does the request want to run?"

# ---------------------------------------------------------------- ls
[[command]]
name = "ls"
description = "list directory contents"
argv = ["ls", "{path:target}"]
risk = "read"

  [[command.path]]
  name = "target"
  kind = "dirs"
  optional = true
  description = "directory to list"
  base = "."
  depth = 2
  question = "Which directory does the request want to list?"
  stated_question = "Does the request name a specific directory to list?"
