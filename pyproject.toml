[project]
name = "hsom"
version = "0.1.0"
description = "Harness for System One Models. | Connects Jev to your shell"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hsom contributors"}]
keywords = ["jev", "typesafe", "system-one", "shell", "cli", "agent-harness"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Shells",
  "Topic :: Utilities",
]
dependencies = [
  "typesafe-sdk>=0.7.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.15",
  "mypy>=1.19",
  "build>=1.2",
  "pip-audit>=2.9",
]
benchmark = [
  "litellm>=1.82",
]

[project.scripts]
hsom = "hsom.cli:main"
hsom-benchmark = "hsom.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["src/hsom"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
